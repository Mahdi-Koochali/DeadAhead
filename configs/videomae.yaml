# For reference only: the code uses the constants in deadahead/video.
# VideoMAE-large recipe, documented in one place (tests/test_video_tiny.py checks it against the constants).

checkpoint:
  repo_id: MCG-NJU/videomae-large
  revision: 12da269a02d3e1fbbb7011e610e591fea8061dca   # licence CC BY-NC 4.0
  files: [config.json, preprocessor_config.json, model.safetensors]
  attention: sdpa
  attention_biases: q_bias and v_bias copied onto query.bias and value.bias; key.bias zero

input:
  crop_px: 128                 # all-frames store, raw phase, float16, zero padding
  frames: 16                   # t - round(40 * i / 15), i = 0..15: 120 min of history, oldest first
  history_frames: 40
  image_size: 224              # bilinear resize from 128
  phase_map: {lo: -0.3, hi: 4.0, curve: "log1p(9 * clip((x - lo) / (hi - lo), 0, 1)) / ln 10"}
  normalisation: ImageNet mean and std of the checkpoint's preprocessor_config.json
  augmentation: one draw per clip; resized crop 50-100 %, flips, 90-degree rotation, blur on half, intensity scale 1 +- 0.075, shift +- 0.03
  augmentation_generator_seed: seed + 1
  test_time_augmentation: none

batch:
  effective: 128
  micro_batch: 16              # 16 x 8 accumulation; 32 x 4 on GPUs with more than 80 GB (changes the order of random draws)
  precision: bf16 autocast on CUDA, no loss scaler

adapt:                          # masked-autoencoder adaptation, per held-out group, eight training groups
  steps: 6000
  optimiser: AdamW
  lr: 7.5e-5
  weight_decay: 0.05            # every parameter
  schedule: linear warm-up from 1e-3 over max(1, int(0.05 * steps)) steps, then cosine
  mask: tube
  mask_ratio: 0.90              # 176 of 196 spatial positions hidden in all 8 temporal groups
  seed: 2601562
  saved: encoder only (decoder discarded)

finetune:                       # end to end, from the fold's adapted encoder
  steps: 6000
  horizon_min: 30
  panel: primary_439
  classes: [NONE, APOPTOSIS, LYTIC]   # censored rows dropped; untyped death -> NONE
  excluded_movies: [DU145_st_2]
  pooling: mean of tokens, then fc_norm
  optimiser: AdamW with layer-wise decay groups
  backbone_lr: [5.0e-5, 2.0e-4]           # grid
  layer_decay: [0.75, 0.9]            # grid; block l gets backbone_lr * decay ** (24 - l), embedding decay ** 25
  head_lr: 1.0e-3
  weight_decay: 0.05
  schedule: linear warm-up from 1e-3 over max(1, int(0.05 * steps)) steps, then cosine
  grad_clip_global_norm: 1.0
  loss: class-weighted cross-entropy x window weight, divided by the summed window weight of the 128 rows
  class_weights: sum(n) / (3 * n_c)
  drop_path: none

select:
  group: training group with the most lytic events (never the held-out group)
  grid_seed: 2601562
  score: lytic AUPRC (average precision) on the selection group
  order: [[5.0e-5, 0.75], [5.0e-5, 0.9], [2.0e-4, 0.75], [2.0e-4, 0.9]]   # exact ties go to the earlier setting
  non_finite: ranks last
  final_seeds: [2601562, 2601563, 2601564]   # winner retrained on all eight training groups

predict:
  batch: 64
  output: p_none, p_apoptosis, p_lytic per held-out 30-min row

features:
  vector: fc_norm(mean of the last hidden state over 1,568 tokens), 1,024 float32 per row
  adapted_vector: mean of the adapted encoder's last hidden state over 1,568 tokens, after its own final LayerNorm, 1,024 float32 per row
  rows: every landmark of the primary panel (53,300), in movie, track, frame order
