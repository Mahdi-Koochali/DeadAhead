name: tests
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r environment/cpu-py312.txt
      - run: pip install -e ".[dev]"
      - run: ruff check
      - run: pytest -m "not data" -q
